    <script>
        function copyEmail() {
            var email = 'yanjialong26@gmail.com';
            var notice = document.getElementById('copyNotice');

            function showNotice() {
                notice.classList.add('show');
                setTimeout(function () { notice.classList.remove('show'); }, 2000);
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(email).then(showNotice).catch(function () {
                    fallbackCopy();
                });
            } else {
                fallbackCopy();
            }

            function fallbackCopy() {
                var ta = document.createElement('textarea');
                ta.value = email;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showNotice();
                } catch (e) {
                    notice.textContent = '复制失败，请手动复制';
                    showNotice();
                }
                document.body.removeChild(ta);
            }
        }
    </script>
